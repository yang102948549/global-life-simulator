name = "anotherday-gemini-relay"
main = "worker.js"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "GeminiRelay"

[[durable_objects.bindings]]
name = "GALLERY"
